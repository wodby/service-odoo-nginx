name: odoo-nginx
type: service
from: nginx
guidance: GUIDANCE.md
fromVersionConstraint: "^2.0.0"
fromVersion: "2.1.7"
title: Nginx (Odoo)

labels:
- odoo

links:
- name: backend
  title: Odoo
  required: true
  env:
  - name: NGINX_BACKEND_HOST
    value: '{{link.host}}'
  - name: NGINX_BACKEND_PORT
    value: '{{link.port}}'
  selectors:
  - type: service
    labels:
    - odoo

# Odoo answers on its own and live updates stay open for long, so requests are
# allowed up to an hour through the gateway.
endpoints:
- name: http
  ports:
  - name: http
    number: 80
    protocol: http
    main: true
    routeDefaults:
      request_timeout: 1h
      backend_request_timeout: 1h

# Nothing from the Odoo repository is served by Nginx: the image is the stock
# one, built only because the base service builds its image.
build:
  link: backend
  dockerfileContent: |
    ARG WODBY_BASE_IMAGE
    FROM ${WODBY_BASE_IMAGE}
  dockerignoreContent: '*'

# Odoo's rules replace the image's http-proxy preset. The service keeps the
# preset name http-proxy, which also makes the image point the app_server
# upstream at the linked Odoo service.
configs:
- name: preset
  title: Odoo preset
  filepath: /etc/gotpl/presets/http-proxy.conf.tmpl
  config: preset.conf.tmpl

env:
- name: NGINX_VHOST_PRESET
  value: http-proxy
# The image's defaults serve some paths, such as /favicon.ico and video files,
# from disk and forbid framing, which breaks Odoo's website editor. The preset
# keeps what Odoo needs.
- name: NGINX_VHOST_NO_DEFAULTS
  value: '1'
# Attachments and imports.
- name: NGINX_CLIENT_MAX_BODY_SIZE
  value: 128m
